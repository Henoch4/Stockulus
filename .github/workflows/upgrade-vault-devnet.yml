name: Upgrade trading_vault on Solana devnet (in place, ID preserved)
on:
  workflow_dispatch:
  push:
    tags:
      - "upgrade-*"

permissions:
  contents: read
  issues: write

env:
  SOLANA_VERSION: "3.1.10"
  CLUSTER: "devnet"
  SOLANA_RPC_URL: "https://api.devnet.solana.com"
  # Live vault program. Upgraded IN PLACE — this address must never change
  # (docs, desk, and submission all link it). Fresh deploys mint new IDs;
  # use deploy-devnet.yml only for brand-new programs.
  VAULT_PROGRAM_ID: "Gd7Ciu6KgPwoajZZgAUNethJAFNe4s3nhJV64XNRz9aF"
  # ProgramData account for the vault program (immutable once deployed).
  PROGRAMDATA_ADDRESS: "DhWaUd89UBZbJP8MNXcqSFbDm1rVX6Cxk8sYoAmzUVN4"

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana/Agave CLI
        shell: bash
        run: |
          set -Eeuo pipefail

          curl --fail --show-error --location \
            "https://release.anza.xyz/v${SOLANA_VERSION}/install" | sh

          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"

          if [[ ! -x "$SOLANA_BIN/solana-keygen" ]]; then
            echo "Solana CLI installation failed"
            exit 1
          fi

          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          export PATH="$SOLANA_BIN:$PATH"

          solana --version
          cargo --version

      - name: Restore funded deployer keypair
        # Same persistent devnet wallet as deploy-devnet.yml (repo secret
        # DEVNET_DEPLOYER_KEY_B64). It is also the vault upgrade authority.
        # config/ci/*.json is gitignored and excluded from artifacts.
        shell: bash
        env:
          DEPLOYER_KEY_B64: ${{ secrets.DEVNET_DEPLOYER_KEY_B64 }}
        run: |
          set -Eeuo pipefail

          test -n "${DEPLOYER_KEY_B64:-}" || {
            echo "DEVNET_DEPLOYER_KEY_B64 is not configured (repo Settings → Secrets → Actions)"
            exit 1
          }

          mkdir -p config/ci
          printf '%s' "$DEPLOYER_KEY_B64" | base64 --decode > config/ci/deployer.json
          chmod 600 config/ci/deployer.json

          DEPLOYER_ID="$(solana-keygen pubkey config/ci/deployer.json)"
          solana-keygen verify "$DEPLOYER_ID" config/ci/deployer.json
          echo "deployer: $DEPLOYER_ID"

      - name: Confirm deployer is the upgrade authority
        # Informational only (public devnet RPC rate-limits runners): the
        # upgrade step below is authoritative and fails loudly if wrong.
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in 1 2 3; do
            solana program show "$VAULT_PROGRAM_ID" -u "$SOLANA_RPC_URL" && break
            echo "program show attempt $i failed — retrying"
            sleep 15
          done || echo "WARNING: program show unreachable; proceeding to upgrade"

      - name: Build trading_vault (SBF)
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo build-sbf --manifest-path programs/trading_vault/Cargo.toml 2>&1 | tee /tmp/build.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Deployer balance (diagnostic, non-fatal)
        shell: bash
        run: |
          solana balance --keypair config/ci/deployer.json -u "$SOLANA_RPC_URL" || true

      - name: Reclaim abandoned buffers (loud, then gate on balance)
        # Failed runs left funded buffers behind (~1.46 SOL each). List by
        # authority first (proves visibility), close each explicitly, then
        # REFUSE to continue unless the deployer holds >= 2 SOL — creating
        # another buffer on an empty wallet just locks more rent.
        shell: bash
        env:
          ABANDONED_BUFFERS: "B86okiZ9msMjKyQVpTApb9AKwFFw95tCL4p5VUUS4AGu FhWBXimZTC5ok2uNR2tBtzTBcgg88FW3AqepUf67PMTg"
        run: |
          set -Eeuo pipefail
          {
            echo "--- balance before ---"
            solana balance --keypair config/ci/deployer.json -u "$SOLANA_RPC_URL" || true
            echo "--- buffers visible to deployer ---"
            solana program show --buffers \
              --buffer-authority config/ci/deployer.json \
              -u "$SOLANA_RPC_URL" || true
            for buf in $ABANDONED_BUFFERS; do
              echo "--- closing $buf ---"
              solana program close "$buf" \
                --buffer-authority config/ci/deployer.json \
                -k config/ci/deployer.json \
                -u "$SOLANA_RPC_URL" || echo "close $buf failed (may already be closed)"
            done
            echo "--- balance after ---"
            solana balance --keypair config/ci/deployer.json -u "$SOLANA_RPC_URL" || true
          } 2>&1 | tee /tmp/reclaim.log
          BAL="$(solana balance --keypair config/ci/deployer.json -u "$SOLANA_RPC_URL" | awk '{print $1}')"
          echo "deployer balance: ${BAL:-0} SOL"
          awk -v b="${BAL:-0}" 'BEGIN { exit !(b >= 2.0) }' || {
            echo "FUNDING GATE: deployer below 2 SOL — send devnet SOL to 2vs2CxnQ4Xz4q8xcQzZHbXorSPyBFZmWhFa2aFG6dmSe (https://faucet.solana.com) then re-run. NOT creating another buffer."
            exit 1
          }

      - name: Write program buffer (retry on RPC flakes)
        shell: bash
        run: |
          set -Eeuo pipefail
          code=1
          for i in 1 2 3; do
            code=0
            solana program write-buffer target/deploy/trading_vault.so \
              -k config/ci/deployer.json \
              -u "$SOLANA_RPC_URL" \
              > /tmp/buffer_$i.log 2>&1 || code=$?
            echo "write-buffer attempt $i exit: $code"
            tail -8 /tmp/buffer_$i.log || true
            if [ "$code" -eq 0 ]; then break; fi
            sleep 20
          done
          cat /tmp/buffer_*.log > /tmp/buffer_full.log
          exit "$code"

      - name: Extend ProgramData for larger binary (if needed)
        # Upgrades fail with "ProgramData account not large enough" when the
        # new .so exceeds the original allocation. Compare raw sizes via
        # JSON-RPC (no CLI output-format guessing) and extend with 10 KiB
        # headroom for future upgrades.
        shell: bash
        run: |
          set -Eeuo pipefail
          SO_BYTES="$(stat -c%s target/deploy/trading_vault.so)"
          DATA_LEN="$(python3 - "$SOLANA_RPC_URL" "$PROGRAMDATA_ADDRESS" <<'PY'
          import base64, json, sys, urllib.request
          rpc, addr = sys.argv[1], sys.argv[2]
          body = json.dumps({"jsonrpc": "2.0", "id": 1, "method": "getAccountInfo",
                             "params": [addr, {"encoding": "base64"}]}).encode()
          req = urllib.request.Request(rpc, data=body, headers={"Content-Type": "application/json"})
          data = json.load(urllib.request.urlopen(req, timeout=30))["result"]["value"]["data"][0]
          print(len(base64.b64decode(data)))
          PY
          )"
          CAPACITY="$((DATA_LEN - 45))"
          ADDITIONAL="$((SO_BYTES + 10240 - CAPACITY))"
          # Loader floor: ExtendProgram rejects anything under 10240 bytes.
          if [ "$ADDITIONAL" -gt 0 ] && [ "$ADDITIONAL" -lt 10240 ]; then
            ADDITIONAL=10240
          fi
          echo "so=$SO_BYTES capacity=$CAPACITY additional=$ADDITIONAL"
          if [ "$ADDITIONAL" -gt 0 ]; then
            code=0
            for i in 1 2 3; do
              code=0
              solana program extend "$VAULT_PROGRAM_ID" "$ADDITIONAL" \
                -k config/ci/deployer.json \
                -u "$SOLANA_RPC_URL" \
                > "/tmp/extend_$i.log" 2>&1 || code=$?
              echo "extend attempt $i exit: $code"
              tail -10 "/tmp/extend_$i.log" || true
              if [ "$code" -eq 0 ]; then break; fi
              sleep 20
            done
            cat /tmp/extend_*.log > /tmp/extend_full.log
            exit "$code"
          else
            echo "no extension needed"
          fi

      - name: Upgrade trading_vault in place
        shell: bash
        run: |
          set -Eeuo pipefail
          BUFFER="$(grep -oE '[1-9A-HJ-NP-Za-km-z]{43,44}' /tmp/buffer_full.log | tail -1)"
          test -n "$BUFFER" || { echo "could not parse buffer address"; exit 1; }
          echo "buffer: $BUFFER"
          code=1
          for i in 1 2 3; do
            code=0
            solana program upgrade "$BUFFER" "$VAULT_PROGRAM_ID" \
              -k config/ci/deployer.json \
              -u "$SOLANA_RPC_URL" \
              --upgrade-authority config/ci/deployer.json \
              > "/tmp/upgrade_$i.log" 2>&1 || code=$?
            echo "attempt $i exit: $code"
            tail -20 "/tmp/upgrade_$i.log" || true
            if [ "$code" -eq 0 ]; then break; fi
            sleep 20
          done
          cat /tmp/upgrade_*.log > /tmp/upgrade_full.log
          exit "$code"

      - name: Capture CLI diagnostics (read-only)
        if: failure()
        shell: bash
        run: |
          {
            echo "--- solana version ---"
            solana --version || true
            echo "--- program upgrade help ---"
            solana program upgrade --help || true
            echo "--- env var bytes ---"
            echo -n "$VAULT_PROGRAM_ID" | od -c | head -5 || true
          } > /tmp/diag.log 2>&1 || true

      - name: Report upgrade failure (public issue, pubkeys only — never keys)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Upgrade run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Program: ${VAULT_PROGRAM_ID}"
            echo "--- build errors (if any) ---"
            grep -B2 -A8 -iE '^error(\[|:)' /tmp/build.log 2>/dev/null | head -60 || echo "(build clean)"
            echo "--- build log tail ---"
            tail -20 /tmp/build.log 2>/dev/null || echo "(no build log)"
            echo "--- reclaim log ---"
            cat /tmp/reclaim.log 2>/dev/null || echo "(no reclaim log)"
            echo "--- buffer log tail ---"
            tail -20 /tmp/buffer_full.log 2>/dev/null || echo "(no buffer log)"
            echo "--- extend log tail ---"
            tail -20 /tmp/extend_full.log 2>/dev/null || echo "(no extend log)"
            echo "--- upgrade log tail ---"
            tail -60 /tmp/upgrade_full.log 2>/dev/null || echo "(no upgrade log)"
            echo "--- CLI diagnostics ---"
            cat /tmp/diag.log 2>/dev/null || echo "(no diagnostics)"
          } > /tmp/issue_raw.txt
          # Scrub recovery material: the CLI prints ephemeral buffer seed
          # phrases on failure. They control rent only the deployer can
          # reclaim, but they must never appear in a public issue.
          python3 - <<'PY'
          import re
          lines = open("/tmp/issue_raw.txt", encoding="utf-8", errors="replace").read().splitlines()
          out, skip = [], 0
          for ln in lines:
            stripped = (ln.strip() or "")
            if "solana-keygen recover" in stripped:
              out.append("[redacted: recovery material — see CI logs]")
              skip = 2
              continue
            if skip > 0:
              skip -= 1
              continue
            if re.fullmatch(r"(?:[a-z]+\s+){11,}[a-z]+", stripped):
              out.append("[redacted: recovery material — see CI logs]")
              continue
            out.append(ln)
          open("/tmp/issue_body.txt", "w", encoding="utf-8").write("\n".join(out) + "\n")
          PY
          gh issue create \
            --title "vault upgrade failed (run ${GITHUB_RUN_ID})" \
            --body-file /tmp/issue_body.txt || true

      - name: Confirm new binary live
        shell: bash
        run: |
          set -Eeuo pipefail
          solana program show "$VAULT_PROGRAM_ID" -u "$SOLANA_RPC_URL"

      - name: Close self-reported failure issues
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --search "vault upgrade failed" --state open \
            --json number -q '.[].number' | xargs -r -n1 gh issue close || true
