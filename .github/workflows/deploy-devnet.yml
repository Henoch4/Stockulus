name: Build + deploy Stockulus programs to Solana devnet
on:
  workflow_dispatch:
  push:
    tags:
      - "deploy-*"

permissions:
  contents: read

env:
  # Agave 3.x ships platform-tools with Cargo >= 1.85 (edition 2024 capable).
  # 2.1.x bundles Cargo 1.79, which chokes on zeroize_derive 1.5.0 / edition2024.
  SOLANA_VERSION: "3.1.10"
  CLUSTER: "devnet"
  # Single source for the devnet endpoint (funding + deploys must agree).
  SOLANA_RPC_URL: "https://api.devnet.solana.com"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana/Agave CLI
        shell: bash
        run: |
          set -Eeuo pipefail

          curl --fail --show-error --location \
            "https://release.anza.xyz/v${SOLANA_VERSION}/install" | sh

          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"

          if [[ ! -x "$SOLANA_BIN/solana-keygen" ]]; then
            echo "Solana CLI installation failed"
            find "$HOME/.local/share/solana" -maxdepth 5 -type f -name 'solana-keygen' -print
            exit 1
          fi

          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          export PATH="$SOLANA_BIN:$PATH"

          solana --version
          solana-keygen --version
          cargo --version
          cargo-build-sbf --version || true

          # Fail fast: Rust edition 2024 (zeroize_derive 1.5.0+) needs Cargo >= 1.85.
          # Gate on the CLI-bundled cargo (platform-tools download lazily on first build).
          cargo_version="$(cargo version | sed -E 's/[^0-9]*([0-9]+\.[0-9]+).*/\1/')"
          if [[ "$(printf '%s\n' "$cargo_version" "1.85" | sort -V | head -n1)" != "1.85" ]]; then
            echo "Cargo ${cargo_version} is too old; Cargo 1.85+ required for edition 2024"
            exit 1
          fi

      - name: Restore funded deployer keypair
        # Persistent pre-funded devnet wallet (repo secret DEVNET_DEPLOYER_KEY_B64,
        # base64 of a solana-keygen JSON). Ephemeral per-run deployers always hit
        # the rate-limited public faucet — this removes airdrops from CI entirely.
        # config/ci/*.json is gitignored and excluded from artifacts.
        id: deployer
        shell: bash
        env:
          DEPLOYER_KEY_B64: ${{ secrets.DEVNET_DEPLOYER_KEY_B64 }}
        run: |
          set -Eeuo pipefail

          test -n "${DEPLOYER_KEY_B64:-}" || {
            echo "DEVNET_DEPLOYER_KEY_B64 is not configured (repo Settings → Secrets → Actions)"
            exit 1
          }

          mkdir -p config/ci
          printf '%s' "$DEPLOYER_KEY_B64" | base64 --decode > config/ci/deployer.json
          chmod 600 config/ci/deployer.json

          solana-keygen verify config/ci/deployer.json
          echo "deployer_id=$(solana-keygen pubkey config/ci/deployer.json)" >> "$GITHUB_OUTPUT"

      - name: Generate program keypairs (ephemeral per deploy)
        # New program IDs every run — update .env from the artifact after each
        # deploy. For stable devnet addresses, persist these as secrets too
        # (same base64 pattern) instead of generating here.
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p config/ci
          solana-keygen new --no-bip39-passphrase -s -o config/ci/trade_audit_kp.json --force
          solana-keygen new --no-bip39-passphrase -s -o config/ci/trading_vault_kp.json --force

      - name: Synchronize generated program IDs
        # declare_id! must be valid base58 AND match the deploy keypair.
        # Placeholders satisfy neither — inject the ephemeral pubkeys pre-build.
        shell: bash
        run: |
          set -Eeuo pipefail

          TRADE_AUDIT_ID="$(solana-keygen pubkey config/ci/trade_audit_kp.json)"
          TRADING_VAULT_ID="$(solana-keygen pubkey config/ci/trading_vault_kp.json)"

          python3 - "$TRADE_AUDIT_ID" "$TRADING_VAULT_ID" <<'PY'
          import pathlib
          import re
          import sys

          trade_audit_id, trading_vault_id = sys.argv[1:]

          replacements = {
              pathlib.Path("programs/trade_audit_trail/src/lib.rs"): trade_audit_id,
              pathlib.Path("programs/trading_vault/src/lib.rs"): trading_vault_id,
          }

          for path, program_id in replacements.items():
              text = path.read_text()
              updated, count = re.subn(
                  r'declare_id!\("[^"]+"\)',
                  f'declare_id!("{program_id}")',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Could not find declare_id! in {path}")
              path.write_text(updated)

          anchor = pathlib.Path("Anchor.toml")
          text = anchor.read_text()
          text = re.sub(
              r'(?m)^trade_audit_trail\s*=\s*"[^"]+"$',
              f'trade_audit_trail = "{trade_audit_id}"',
              text,
          )
          text = re.sub(
              r'(?m)^trading_vault\s*=\s*"[^"]+"$',
              f'trading_vault = "{trading_vault_id}"',
              text,
          )
          anchor.write_text(text)
          PY

          echo "trade_audit_trail: $TRADE_AUDIT_ID"
          echo "trading_vault: $TRADING_VAULT_ID"

      - name: Build trade_audit_trail (SBF)
        run: cargo build-sbf --manifest-path programs/trade_audit_trail/Cargo.toml
      - name: Build trading_vault (SBF)
        run: cargo build-sbf --manifest-path programs/trading_vault/Cargo.toml

      - name: Verify deployer funding (no faucet, fail-fast)
        # No airdrop attempts: the deployer is pre-funded off-run. Top it up
        # via https://faucet.solana.com or a transfer when this check fails.
        shell: bash
        run: |
          set -Eeuo pipefail

          DEPLOYER_KEY="config/ci/deployer.json"
          REQUIRED_SOL=3

          balance="$(
            solana balance \
              --keypair "$DEPLOYER_KEY" \
              --url "$SOLANA_RPC_URL" |
            awk '{print $1}'
          )"

          echo "Deployer balance: ${balance:-0} SOL"

          if ! awk -v balance="${balance:-0}" \
                   -v required="$REQUIRED_SOL" \
                   'BEGIN { exit !(balance >= required) }'; then
            echo "Deployer requires at least ${REQUIRED_SOL} SOL on ${SOLANA_RPC_URL}"
            exit 1
          fi

      - name: Deploy trade_audit_trail
        run: |
          solana program deploy -k config/ci/deployer.json \
            -u "$SOLANA_RPC_URL" \
            --program-id config/ci/trade_audit_kp.json \
            target/deploy/trade_audit_trail.so

      - name: Deploy trading_vault
        run: |
          solana program deploy -k config/ci/deployer.json \
            -u "$SOLANA_RPC_URL" \
            --program-id config/ci/trading_vault_kp.json \
            target/deploy/trading_vault.so

      - name: Emit live program IDs for submission
        run: |
          echo "TRADE_AUDIT_TRAIL_ID=$(solana-keygen pubkey config/ci/trade_audit_kp.json)" | tee -a target/deploy/devnet.env
          echo "TRADING_VAULT_ID=$(solana-keygen pubkey config/ci/trading_vault_kp.json)" | tee -a target/deploy/devnet.env
          echo "CLUSTER=devnet" >> target/deploy/devnet.env

      - name: Upload devnet artifacts (pubkeys + binaries ONLY — never keypairs)
        uses: actions/upload-artifact@v4
        with:
          name: devnet-deploy
          # SECURITY: config/ci/*.json holds PRIVATE keys (deployer + program
          # upgrade authorities). They must never leave the runner. devnet.env
          # carries pubkeys only — that is all the submission needs.
          path: |
            target/deploy/*.so
            target/deploy/devnet.env
          retention-days: 7
